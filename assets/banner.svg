<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".25"/><stop offset="100%" stop-color="#7c3aed" stop-opacity=".25"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.grid-line{stroke:#1f2937;stroke-width:1;stroke-dasharray:4,4;opacity:.45}.packet-stream{stroke-dasharray:8 16;animation:dash 2.5s linear infinite}.packet-stream-rev{stroke-dasharray:10 20;animation:dash-rev 3s linear infinite}.pulsing-orb{animation:pulse 4s ease-in-out infinite;transform-origin:center}.floating{animation:float-pill 4s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)"/><circle cx="180" cy="100" r="140" fill="#38bdf8" class="pulsing-orb" filter="url(#glow)" opacity=".08"/><circle cx="1020" cy="300" r="160" fill="#a855f7" class="pulsing-orb" filter="url(#glow)" opacity=".08"/><circle cx="600" cy="200" r="220" fill="#6366f1" class="pulsing-orb" filter="url(#glow)" opacity=".05"/><line x1="0" x2="1200" y1="80" y2="80" class="grid-line"/><line x1="0" x2="1200" y1="160" y2="160" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="320" y2="320" class="grid-line"/><line x1="200" x2="200" y1="0" y2="400" class="grid-line"/><line x1="400" x2="400" y1="0" y2="400" class="grid-line"/><line x1="600" x2="600" y1="0" y2="400" class="grid-line"/><line x1="800" x2="800" y1="0" y2="400" class="grid-line"/><line x1="1000" x2="1000" y1="0" y2="400" class="grid-line"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50,330 Q 300,380 600,330 T 1150,350" class="packet-stream" opacity=".35"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50,70 Q 350,20 700,70 T 1150,50" class="packet-stream-rev" opacity=".3"/><path fill="none" stroke="#6366f1" stroke-width="1.5" d="M 100,200 Q 400,270 800,180 T 1100,220" class="packet-stream" opacity=".25"/><g opacity=".6"><circle cx="200" cy="160" r="4" fill="#38bdf8"/><circle cx="400" cy="240" r="4" fill="#818cf8"/><circle cx="800" cy="160" r="4" fill="#c084fc"/><circle cx="1000" cy="240" r="4" fill="#38bdf8"/></g><g class="floating" transform="translate(470, 48)"><rect width="260" height="32" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" opacity=".8" rx="16"/><circle cx="20" cy="16" r="5" fill="#34d399"/><text x="35" y="21" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED DEVELOPER STACK</text></g><text x="600" y="150" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome API Debugging &amp; Network Console</text><text x="600" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing=".2" text-anchor="middle">The Definitive Guide to Packet Analyzers, MITM Proxies, Mock Servers &amp; API Inspection</text><g class="floating"><g transform