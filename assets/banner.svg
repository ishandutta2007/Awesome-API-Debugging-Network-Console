<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.25" />
    </linearGradient>

    <!-- Radar Pulse / Wave Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1f2937; stroke-width: 1; stroke-dasharray: 4,4; opacity: 0.45; }
    .packet-stream { stroke-dasharray: 8 16; animation: dash 2.5s linear infinite; }
    .packet-stream-rev { stroke-dasharray: 10 20; animation: dash-rev 3s linear infinite; }
    
    @keyframes dash {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dash-rev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.06); }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .pulsing-orb {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .floating {
      animation: float-pill 4s ease-in-out infinite;
    }
    .floating-delay {
      animation: float-pill 4s ease-in-out infinite 2s;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle class="pulsing-orb" cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle class="pulsing-orb" cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)" />
  <circle class="pulsing-orb" cx="600" cy="200" r="220" fill="#6366f1" opacity="0.05" filter="url(#glow)" />

  <!-- Technical Grid Background -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

  <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />

  <!-- Dynamic Network Stream Lines in Background -->
  <path d="M 50,330 Q 300,380 600,330 T 1150,350" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="packet-stream" />
  <path d="M 50,70 Q 350,20 700,70 T 1150,50" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3" class="packet-stream-rev" />
  <path d="M 100,200 Q 400,270 800,180 T 1100,220" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.25" class="packet-stream" />

  <!-- Interactive / Aesthetic Telemetry Nodes -->
  <g opacity="0.6">
    <circle cx="200" cy="160" r="4" fill="#38bdf8" />
    <circle cx="400" cy="240" r="4" fill="#818cf8" />
    <circle cx="800" cy="160" r="4" fill="#c084fc" />
    <circle cx="1000" cy="240" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Header Tag / Badge -->
  <g class="floating" transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="35" y="21" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED DEVELOPER STACK</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primary-grad)" letter-spacing="-0.5">
    Awesome API Debugging &amp; Network Console
  </text>

  <!-- Foreground Subtitle / Description -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The Definitive Guide to Packet Analyzers, MITM Proxies, Mock Servers &amp; API Inspection
  </text>

  <!-- Dynamic Feature Badges in Lower Foreground -->
  <g transform="translate(180, 260)" class="floating">
    <!-- Badge 1: Packet Analysis -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🦈 Packet Analyzers</text>
    </g>

    <!-- Badge 2: Intercepting Proxies -->
    <g transform="translate(220, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="26" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🛡️ MITM HTTP Proxies</text>
    </g>

    <!-- Badge 3: API Testing & Mocks -->
    <g transform="translate(440, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="26" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚡ API Clients &amp; Mocks</text>
    </g>

    <!-- Badge 4: Network Consoles -->
    <g transform="translate(660, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="26" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🌐 Network Consoles</text>
    </g>
  </g>

  <!-- Bottom Console Status Line -->
  <text x="600" y="365" text-anchor="middle" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="12" fill="#475569">
    HTTP/1.1 • HTTP/2 • HTTP/3 (QUIC) • WebSocket • gRPC • GraphQL • TCP/UDP
  </text>
</svg>
